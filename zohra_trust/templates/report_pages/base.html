<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
	body { font-family: "Carlito", "Arimo", "Liberation Sans", sans-serif; font-size: 21px; color: #000; margin: 0; }
	h1, h2, h3 { margin: 6px 0; text-align: center; }
	h1 { font-size: 28px; } h2 { font-size: 29px; text-decoration: underline; } h3 { font-size: 25px; text-decoration: underline; }
	table.grid { border-collapse: collapse; width: 100%; }
	table.grid th, table.grid td { border: 1.5px solid #000; padding: 12px 10px; vertical-align: top; }
	table.grid th { text-align: left; font-weight: bold; }
	table.grid thead { display: table-header-group; }
	table.grid tr { page-break-inside: avoid; }
	.num { text-align: right; white-space: nowrap; }
	.center { text-align: center; }
	.sign { margin-top: 64px; text-align: right; font-weight: bold; font-size: 22px; }
	.small { font-size: 16px; }
	table.layout { border-collapse: collapse; width: 100%; }
	table.layout td { vertical-align: top; }
	.side { width: 29%; font-size: 17px; padding-right: 10px; border-right: 1.5px solid #000; }
	.side .name { font-weight: bold; }
	.side .block { margin-bottom: 14px; line-height: 1.25; }
	.main { padding-left: 14px; }
	.letterhead { text-align: center; margin-bottom: 4px; padding-bottom: 6px; border-bottom: 1.5px solid #000; }
	.letterhead .trust { font-size: 32px; font-weight: bold; line-height: 1.25; max-width: 72%; margin: 0 auto; }
	.kn { font-family: "Noto Sans Kannada", sans-serif; }
	.break { page-break-before: always; }
	.page-break { page-break-after: always; }
	.label td { padding: 2px 0; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
