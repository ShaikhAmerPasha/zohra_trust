<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
	body { font-family: "Noto Sans Kannada", "Arimo", "Liberation Sans", sans-serif; font-size: 12px; color: #000; margin: 0; }
	h1, h2, h3 { margin: 4px 0; text-align: center; }
	h1 { font-size: 17px; } h2 { font-size: 14px; } h3 { font-size: 12px; }
	table.grid { border-collapse: collapse; width: 100%; }
	table.grid th, table.grid td { border: 1px solid #000; padding: 3px 5px; vertical-align: top; }
	table.grid th { text-align: center; }
	table.grid thead { display: table-header-group; }
	table.grid tr { page-break-inside: avoid; }
	.num { text-align: right; white-space: nowrap; }
	.center { text-align: center; }
	.sign { margin-top: 48px; text-align: right; font-weight: bold; }
	.small { font-size: 10px; }
	table.layout { border-collapse: collapse; width: 100%; }
	table.layout td { vertical-align: top; }
	.side { width: 28%; font-size: 10px; padding-right: 8px; }
	.side .name { font-weight: bold; }
	.side .block { margin-bottom: 9px; }
	.letterhead { text-align: center; margin-bottom: 8px; }
	.letterhead .trust { font-size: 16px; font-weight: bold; }
	.kn { font-family: "Noto Sans Kannada", sans-serif; }
	.break { page-break-before: always; }
	.label td { padding: 2px 0; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
